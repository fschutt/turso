[package]
name = "turso-sync-sdk-kit-azul"
description = "Azul fork of turso_sync_sdk_kit 0.7.2, depending on turso-sdk-kit-azul (io_uring opt-in). Low-level C ABI for Turso Cloud sync; Rust applications use `turso-azul`."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/fschutt/turso"

[features]
pure-rust-crypto = ["turso_core/pure-rust-crypto", "turso_sdk_kit/pure-rust-crypto"]

[lib]
name = "turso_sync_sdk_kit"
doc = false
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
env_logger = { workspace = true, default-features = false }
turso_core = { workspace = true }
turso_sync_engine = { workspace = true }
turso_sdk_kit = { workspace = true }
turso_sdk_kit_macros = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
genawaiter = { version = "0.99.1", default-features = false }
parking_lot = { workspace = true, features = ["arc_lock", "send_guard"] }

[build-dependencies]
bindgen = "0.69.5"
