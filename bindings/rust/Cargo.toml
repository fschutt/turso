[package]
name = "turso"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Turso Rust API"

[features]
default = ["experimental_indexes"]
conn_raw_api = ["turso_core/conn_raw_api"]
experimental_indexes = []
antithesis = ["turso_core/antithesis"]

[dependencies]
turso_core = { workspace = true }
thiserror = "2.0.9"

# io_uring's prebuilt bindings (io-uring crate) only support 64-bit Linux
# targets (i686/armv7/s390x fail with "prebuilt sys.rs may not be compatible").
# Enable the io_uring backend only there; other targets use the syscall
# (UnixIO/GenericIO) fallback.
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
turso_core = { workspace = true, features = ["io_uring"] }

[dev-dependencies]
tempfile = "3.20.0"
tokio = { version = "1.29.1", features = ["full"] }
rand = "0.8.5"
rand_chacha = "0.3.1"
